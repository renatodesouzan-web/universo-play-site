<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universo Play - Teste Grátis</title>
<style>
       body {
           font-family: Arial, sans-serif;
           background-color: #0f172a;
           color: #ffffff;
           display: flex;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
           margin: 0;
           padding: 20px;
       }
       .container {
           background-color: #1e293b;
           padding: 30px;
           border-radius: 12px;
           box-shadow: 0 4px 20px rgba(0,0,0,0.5);
           max-width: 400px;
           width: 100%;
       }
       h2 {
           text-align: center;
           color: #38bdf8;
           margin-bottom: 20px;
       }
       .form-group {
           margin-bottom: 15px;
       }
       label {
           display: block;
           margin-bottom: 5px;
           font-size: 14px;
       }
       input {
           width: 100%;
           padding: 10px;
           border-radius: 6px;
           border: 1px solid #334155;
           background-color: #0f172a;
           color: #fff;
           box-sizing: border-box;
       }
       button {
           width: 100%;
           padding: 12px;
           background-color: #0284c7;
           color: white;
           border: none;
           border-radius: 6px;
           font-size: 16px;
           font-weight: bold;
           cursor: pointer;
           margin-top: 10px;
       }
       button:hover {
           background-color: #0369a1;
       }
       #mensagem {
           margin-top: 15px;
           text-align: center;
           font-size: 14px;
       }
</style>
</head>
<body>
<div class="container">
<h2>Solicitar Teste Grátis</h2>
<form id="formTeste">
<div class="form-group">
<label for="nome">Nome Completo</label>
<input type="text" id="nome" required placeholder="Digite seu nome">
</div>
<div class="form-group">
<label for="whatsapp">WhatsApp (com DDD)</label>
<input type="tel" id="whatsapp" required placeholder="Ex: 21999999999">
</div>
<button type="submit" id="btnEnviar">Gerar Acesso de Teste</button>
</form>
<div id="mensagem"></div>
</div>
<script>
   document.getElementById('formTeste').addEventListener('submit', async (e) => {
       e.preventDefault();
       const btn = document.getElementById('btnEnviar');
       const msg = document.getElementById('mensagem');
       btn.disabled = true;
       btn.innerText = 'Gerando teste...';
       msg.innerText = '';
       const dados = {
           nome: document.getElementById('nome').value,
           whatsapp: document.getElementById('whatsapp').value
       };
       try {
           const resposta = await fetch('https://universo-play-backend.onrender.com/api/criar-cliente', {
               method: 'POST',
               headers: {
                   'Content-Type': 'application/json'
               },
               body: JSON.stringify(dados)
           });
           const resultado = await resposta.json();
           if (resposta.ok) {
               msg.style.color = '#4ade80';
               msg.innerText = 'Teste criado com sucesso! Verifique seu WhatsApp.';
           } else {
               msg.style.color = '#f87171';
               msg.innerText = resultado.erro || 'Erro ao gerar teste.';
           }
       } catch (erro) {
           msg.style.color = '#f87171';
           msg.innerText = 'Erro ao conectar ao servidor.';
       } finally {
           btn.disabled = false;
           btn.innerText = 'Gerar Acesso de Teste';
       }
   });
</script>
</body>
</html>
